# One grouped pull request per ecosystem a month, so related bumps (react + react-dom,
# upload-artifact + download-artifact) land together and CI judges them as a set.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    groups:
      app:
        patterns: ["*"]
    ignore:
      # eslint-config-expo bundles an eslint-plugin-react that breaks on ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # TypeScript 7 breaks the typecheck tooling; revisit once Expo and typescript-eslint support it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
