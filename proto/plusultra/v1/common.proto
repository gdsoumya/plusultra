syntax = "proto3";

package plusultra.v1;

import "buf/validate/validate.proto";
import "plusultra/v1/rules.proto";

option go_package = "github.com/gdsoumya/plusultra/gen/go/plusultra/v1;plusultrav1";

// Unit is a weight unit.
enum Unit {
  // No unit given; the server uses the user's preferred unit.
  UNIT_UNSPECIFIED = 0;
  // Kilograms.
  UNIT_KG = 1;
  // Pounds.
  UNIT_LB = 2;
}

// LengthUnit is a unit of body measurements.
enum LengthUnit {
  // No unit given; the server uses centimetres.
  LENGTH_UNIT_UNSPECIFIED = 0;
  // Centimetres.
  LENGTH_UNIT_CM = 1;
  // Inches.
  LENGTH_UNIT_IN = 2;
}

// Weight is an absolute weight with its unit.
message Weight {
  // Amount in the given unit, for example 82.5.
  double value = 1 [(buf.validate.field).double.finite = true];
  // Unit of the amount; unspecified means the user's preferred unit.
  Unit unit = 2 [(buf.validate.field).enum.defined_only = true];
}

// Macros are nutrition amounts.
message Macros {
  // Energy in kilocalories.
  double kcal = 1 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // Protein in grams.
  double protein = 2 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // Carbohydrates in grams.
  double carbs = 3 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // Fat in grams.
  double fat = 4 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // Fiber in grams.
  double fiber = 5 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // Water in millilitres.
  double water_ml = 6 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
}

// Rounding says how weights round to what the user's equipment can load, in the user's units.
message Rounding {
  // Rounding kind: "plates" (bar plus pairs of plates), "fixed" (only the listed weights), "stack" (multiples of increment) or "bodyweight" (no rounding).
  string kind = 1 [(buf.validate.field).string = {
    in: [
      "plates",
      "fixed",
      "stack",
      "bodyweight"
    ]
  }];
  // Step between loadable weights for stack rounding, for example 5.
  double increment = 2 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // Empty bar weight for plates rounding, for example 20.
  double bar = 3 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // Plates available per side for plates rounding, or every loadable weight for fixed rounding.
  repeated double plates = 4 [(buf.validate.field).repeated = {
    max_items: 100
    items: {
      double: {
        gt: 0
        finite: true
      }
    }
  }];
}

// DateRange is an inclusive range of local calendar dates.
message DateRange {
  option (buf.validate.message).cel = {
    id: "date_range.order"
    message: "to must not be before from"
    expression: "this.to >= this.from"
  };

  // First date, YYYY-MM-DD.
  string from = 1 [(buf.validate.field).string.(plusultra.v1.date) = true];
  // Last date, YYYY-MM-DD, on or after from.
  string to = 2 [(buf.validate.field).string.(plusultra.v1.date) = true];
}

// ResolvedSet is one concrete set, with its weight already rounded to the user's equipment.
message ResolvedSet {
  // Target reps; the top of the range when the set has a rep range.
  int32 reps = 1;
  // Bottom of the rep range; equal to reps for a fixed rep count.
  int32 min_reps = 2;
  // Weight to lift.
  Weight weight = 3;
  // Target RPE (rate of perceived exertion, 1 to 10); 0 when none.
  double rpe = 4;
  // Rest timer after the set, in seconds; 0 when none.
  int32 rest = 5;
  // Work timer for the set, in seconds; 0 when none.
  int32 work = 6;
  // True when the set is as many reps as possible.
  bool amrap = 7;
  // True when the user is asked for the weight when doing the set.
  bool ask = 8;
  // True when the user should log the RPE they reached.
  bool log_rpe = 9;
  // True when the work timer advances to the next set on its own.
  bool auto = 10;
  // True when the timer keeps counting up past the work time.
  bool count_up = 11;
  // True for a warmup set; warmups come before working sets.
  bool warmup = 12;
  // Set group label, for example "Work" or "Backoff".
  string label = 13;
}

// ResolvedExercise is an exercise on a resolved day.
message ResolvedExercise {
  // Exercise name to do today, the current alternate, for example "Bench Press".
  string name = 1;
  // Equipment variant, for example "barbell".
  string equipment = 2;
  // Label that tells apart two instances of the same exercise with different progressions.
  string label = 3;
  // Every alternate exercise name; they share sets, weights and progression.
  repeated string alternates = 4;
  // 1-based index of name in alternates.
  int32 current = 5;
  // Description shown with the exercise.
  string desc = 6;
  // Superset group; exercises with the same group are done back to back.
  string superset = 7;
  // Sets to do, warmups first.
  repeated ResolvedSet sets = 8;
  // Catalog slug of name, for example "bench-press-barbell"; empty when the name is not in the catalog.
  string slug = 9;
  // True when the user does name one side at a time, from their exercise data; left and right reps are then logged separately.
  bool unilateral = 10;
  // Short summary of the exercise's progression, for example "Linear: +2.5 kg after a successful workout"; empty when it has none.
  string progression = 11;
}

// ResolvedDay is a workout program day with concrete sets for the user.
message ResolvedDay {
  // Program the day belongs to.
  string program_id = 1;
  // Date of the day, YYYY-MM-DD, for anchored programs; empty for floating programs.
  string date = 2;
  // 1-based week of the program.
  int32 week = 3;
  // 1-based day within the week; Monday is 1 in anchored programs.
  int32 day = 4;
  // Day name, for example "Upper A".
  string name = 5;
  // Day description.
  string desc = 6;
  // Day kind: "training", "conditioning", "rest" or "note".
  string kind = 7;
  // Exercises in order.
  repeated ResolvedExercise exercises = 8;
}
