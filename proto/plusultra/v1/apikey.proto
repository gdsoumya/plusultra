syntax = "proto3";

package plusultra.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "protomcp/v1/annotations.proto";

option go_package = "github.com/gdsoumya/plusultra/gen/go/plusultra/v1;plusultrav1";

// ApiKeyService manages API keys for scripts and LLM clients.
service ApiKeyService {
  option (protomcp.v1.service) = {tool_prefix: "keys_"};

  // CreateApiKey creates an API key. The plaintext key is returned only once.
  rpc CreateApiKey(CreateApiKeyRequest) returns (CreateApiKeyResponse);
  // ListApiKeys lists the user's API keys without their secrets.
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse) {
    option (protomcp.v1.tool) = {
      name: "list"
      title: "List API Keys"
      description: "Lists the user's API keys, newest first, revoked ones included, with name, prefix, scopes, expiry and last use. Secrets are never returned. Use it to find a key's id before keys_revoke."
      read_only: true
      idempotent: true
    };
  }
  // RevokeApiKey revokes an API key; it stops working at once.
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse) {
    option (protomcp.v1.tool) = {
      name: "revoke"
      title: "Revoke API Key"
      description: "Revokes an API key by id (from keys_list); it stops working at once and cannot be restored. Revoking the key this session uses ends your own access. Confirm with the user first. Returns the revoked key."
      idempotent: true
      destructive: true
    };
  }
}

// ApiKeyScope is what an API key may do.
enum ApiKeyScope {
  // No scope.
  API_KEY_SCOPE_UNSPECIFIED = 0;
  // Read the user's data.
  API_KEY_SCOPE_READ = 1;
  // Create, change and delete the user's data.
  API_KEY_SCOPE_WRITE = 2;
  // Manage users and invites.
  API_KEY_SCOPE_ADMIN = 3;
}

// ApiKey is an API key without its secret.
message ApiKey {
  // Key id.
  string id = 1;
  // Name chosen by the user, for example "claude desktop".
  string name = 2;
  // Public prefix that identifies the key, the part after "lsk_".
  string prefix = 3;
  // What the key may do.
  repeated ApiKeyScope scopes = 4;
  // When the key stops working.
  google.protobuf.Timestamp expires_at = 5;
  // When the key was revoked; unset while active.
  google.protobuf.Timestamp revoked_at = 6;
  // When the key was last used; unset if never.
  google.protobuf.Timestamp last_used_at = 7;
  // When the key was created.
  google.protobuf.Timestamp created_at = 8;
}

// CreateApiKeyRequest is the input of CreateApiKey.
message CreateApiKeyRequest {
  // Name for the key, 1 to 64 characters.
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 64
  }];
  // Scopes to grant; at least one.
  repeated ApiKeyScope scopes = 2 [(buf.validate.field).repeated = {
    min_items: 1
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  // When the key stops working; required, at most 365 days ahead.
  google.protobuf.Timestamp expires_at = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).timestamp = {
      gt_now: true
      within: {seconds: 31536000}
    }
  ];
}

// CreateApiKeyResponse is the output of CreateApiKey.
message CreateApiKeyResponse {
  // Plaintext key, "lsk_<prefix>_<secret>". Shown only this once; send it as "Authorization: Bearer <key>".
  string key = 1;
  // The stored key.
  ApiKey api_key = 2;
}

// ListApiKeysRequest is the input of ListApiKeys.
message ListApiKeysRequest {}

// ListApiKeysResponse is the output of ListApiKeys.
message ListApiKeysResponse {
  // Keys, newest first, revoked ones included.
  repeated ApiKey api_keys = 1;
}

// RevokeApiKeyRequest is the input of RevokeApiKey.
message RevokeApiKeyRequest {
  // Key id.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// RevokeApiKeyResponse is the output of RevokeApiKey.
message RevokeApiKeyResponse {
  // The revoked key.
  ApiKey api_key = 1;
}
